plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
    alias(libs.plugins.ksp)
    alias(libs.plugins.room)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.jetbrainsCompose)
    alias(libs.plugins.compose.compiler)
}

android {
    namespace 'com.merahputihperkasa.prodigi'
    compileSdk 35

    def envOrProperty = { String key, String defaultValue ->
        def gradleValue = providers.gradleProperty(key).orNull
        if (gradleValue != null && !gradleValue.isBlank()) {
            return gradleValue
        }

        def envValue = System.getenv(key)
        if (envValue != null && !envValue.isBlank()) {
            return envValue
        }

        return defaultValue
    }

    defaultConfig {
        applicationId envOrProperty("APP_APPLICATION_ID", "com.merahputihperkasa.prodigi")
        minSdk 23
        targetSdk 35
        versionCode 9
        versionName '2.2.3'

        manifestPlaceholders = [
                appIcon     : envOrProperty("APP_ICON", "ic_launcher"),
                appRoundIcon: envOrProperty("APP_ROUND_ICON", "ic_launcher")
        ]

        resValue "string", "config_app_name", envOrProperty("APP_NAME", "Prodigi Book Reader")

        buildConfigField "String", "BRAND_PRIMARY_LIGHT", "\"${envOrProperty('BRAND_PRIMARY_LIGHT', '#818DE4')}\""
        buildConfigField "String", "BRAND_PRIMARY_DARK", "\"${envOrProperty('BRAND_PRIMARY_DARK', '#454F9B')}\""
        buildConfigField "String", "BRAND_SECONDARY_LIGHT", "\"${envOrProperty('BRAND_SECONDARY_LIGHT', '#9EA8BA')}\""
        buildConfigField "String", "BRAND_SECONDARY_DARK", "\"${envOrProperty('BRAND_SECONDARY_DARK', '#5E6676')}\""
        buildConfigField "String", "BRAND_TERTIARY_LIGHT", "\"${envOrProperty('BRAND_TERTIARY_LIGHT', '#7ED5EF')}\""
        buildConfigField "String", "BRAND_TERTIARY_DARK", "\"${envOrProperty('BRAND_TERTIARY_DARK', '#428DA4')}\""
        buildConfigField "String", "BRAND_SURFACE_LIGHT", "\"${envOrProperty('BRAND_SURFACE_LIGHT', '#FAFAFA')}\""
        buildConfigField "String", "BRAND_SURFACE_DARK", "\"${envOrProperty('BRAND_SURFACE_DARK', '#141D35')}\""
        buildConfigField "boolean", "BRAND_ENABLE_DYNAMIC_COLOR", envOrProperty("BRAND_ENABLE_DYNAMIC_COLOR", "false")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        multiDexEnabled false

        ndk {
            debugSymbolLevel 'FULL'
        }
    }

    flavorDimensions += "brand"
    productFlavors {
        prodigi {
            dimension "brand"
        }
        custom {
            dimension "brand"
            applicationId envOrProperty("CUSTOM_APPLICATION_ID", envOrProperty("APP_APPLICATION_ID", "com.merahputihperkasa.prodigi.custom"))

            manifestPlaceholders = [
                    appIcon     : envOrProperty("CUSTOM_APP_ICON", envOrProperty("APP_ICON", "ic_launcher")),
                    appRoundIcon: envOrProperty("CUSTOM_APP_ROUND_ICON", envOrProperty("APP_ROUND_ICON", "ic_launcher"))
            ]

            resValue "string", "config_app_name", envOrProperty("CUSTOM_APP_NAME", envOrProperty("APP_NAME", "Prodigi Book Reader"))

            buildConfigField "String", "BRAND_PRIMARY_LIGHT", "\"${envOrProperty('CUSTOM_BRAND_PRIMARY_LIGHT', envOrProperty('BRAND_PRIMARY_LIGHT', '#818DE4'))}\""
            buildConfigField "String", "BRAND_PRIMARY_DARK", "\"${envOrProperty('CUSTOM_BRAND_PRIMARY_DARK', envOrProperty('BRAND_PRIMARY_DARK', '#454F9B'))}\""
            buildConfigField "String", "BRAND_SECONDARY_LIGHT", "\"${envOrProperty('CUSTOM_BRAND_SECONDARY_LIGHT', envOrProperty('BRAND_SECONDARY_LIGHT', '#9EA8BA'))}\""
            buildConfigField "String", "BRAND_SECONDARY_DARK", "\"${envOrProperty('CUSTOM_BRAND_SECONDARY_DARK', envOrProperty('BRAND_SECONDARY_DARK', '#5E6676'))}\""
            buildConfigField "String", "BRAND_TERTIARY_LIGHT", "\"${envOrProperty('CUSTOM_BRAND_TERTIARY_LIGHT', envOrProperty('BRAND_TERTIARY_LIGHT', '#7ED5EF'))}\""
            buildConfigField "String", "BRAND_TERTIARY_DARK", "\"${envOrProperty('CUSTOM_BRAND_TERTIARY_DARK', envOrProperty('BRAND_TERTIARY_DARK', '#428DA4'))}\""
            buildConfigField "String", "BRAND_SURFACE_LIGHT", "\"${envOrProperty('CUSTOM_BRAND_SURFACE_LIGHT', envOrProperty('BRAND_SURFACE_LIGHT', '#FAFAFA'))}\""
            buildConfigField "String", "BRAND_SURFACE_DARK", "\"${envOrProperty('CUSTOM_BRAND_SURFACE_DARK', envOrProperty('BRAND_SURFACE_DARK', '#141D35'))}\""
            buildConfigField "boolean", "BRAND_ENABLE_DYNAMIC_COLOR", envOrProperty("CUSTOM_BRAND_ENABLE_DYNAMIC_COLOR", envOrProperty("BRAND_ENABLE_DYNAMIC_COLOR", "false"))
        }
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            multiDexEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("String", "BUILD_TYPE", "\"release\"")
        }
        debug {
            shrinkResources false
            minifyEnabled false
            multiDexEnabled false
            debuggable true
            buildConfigField("String", "BUILD_TYPE", "\"debug\"")
        }
    }
    room {
        schemaDirectory "$projectDir/schemas"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_20
        targetCompatibility JavaVersion.VERSION_20
    }
    kotlinOptions {
        jvmTarget = '20'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    packaging {
        resources {
            it.excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.navigation
    implementation libs.kotlinx.serialization.json
    implementation libs.androidx.work.runtime.ktx
    implementation libs.squircle.shape
    implementation libs.accompanist.permissions

    // Code Scanner
    implementation libs.code.scanner

    // Retrofit
    implementation libs.retrofit
    implementation libs.converter.gson
    // OkHTTP
    implementation libs.okhttp
    implementation libs.logging.interceptor

    // Room DB
    implementation libs.room
    implementation libs.room.coroutine
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.constraintlayout.compose
    annotationProcessor libs.room.compiler
    // To use Kotlin Symbol Processing (KSP)
    ksp libs.room.compiler

    // Coil for image
    implementation libs.coil.compose

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
}
